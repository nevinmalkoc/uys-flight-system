events { worker_connections 1024; }

http {
    upstream flight_service {
        server flight-service:8081;
    }

    upstream archive_service {
        server flight-archive-service:8082;
    }

    upstream reference_service {
        server reference-manager:8083;
    }

    server {
        listen 8000;

        location /api/v1/flights {
            client_max_body_size 10M;
            proxy_pass http://flight_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /ws-uys {
            proxy_pass http://flight_service/ws-uys;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/v1/auth {
            proxy_pass http://flight_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /swagger-ui {
            proxy_pass http://flight_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /v3/api-docs {
            proxy_pass http://flight_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/archives {
            proxy_pass http://archive_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/stations {
            proxy_pass http://reference_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
